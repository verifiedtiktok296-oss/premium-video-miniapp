<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Video Downloader</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #111827;
    min-height: 100vh;
}

.header {
    background: #ffffff;
    padding: 22px 18px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.subtitle {
    color: #6b7280;
    margin-top: 6px;
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px 15px 40px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.card h2 {
    font-size: 19px;
    margin-bottom: 15px;
}

.platforms {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.platform {
    border: 1px solid #e5e7eb;
    background: #fff;
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.platform:active {
    transform: scale(0.97);
}

.platform.selected {
    border: 2px solid #111827;
    background: #f3f4f6;
}

.icon {
    display: block;
    font-size: 27px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
    margin-bottom: 12px;
}

input:focus {
    border-color: #111827;
}

.download {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.download:active {
    transform: scale(0.98);
}

.status {
    display: none;
    text-align: center;
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #f3f4f6;
    color: #374151;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">⚡ Premium Video Downloader</div>
    <div class="subtitle">Download your favorite videos easily</div>
</div>

<div class="container">

    <div class="card">
        <h2>Choose Platform</h2>

        <div class="platforms">

            <div class="platform" onclick="selectPlatform(this, 'TikTok')">
                <span class="icon">🎵</span>
                TikTok
            </div>

            <div class="platform" onclick="selectPlatform(this, 'Instagram')">
                <span class="icon">📸</span>
                Instagram
            </div>

            <div class="platform" onclick="selectPlatform(this, 'YouTube Shorts')">
                <span class="icon">▶️</span>
                YouTube Shorts
            </div>

            <div class="platform" onclick="selectPlatform(this, 'Pinterest')">
                <span class="icon">📌</span>
                Pinterest
            </div>

            <div class="platform" onclick="selectPlatform(this, 'Facebook')">
                <span class="icon">🔵</span>
                Facebook
            </div>

            <div class="platform" onclick="selectPlatform(this, 'Snapchat')">
                <span class="icon">👻</span>
                Snapchat
            </div>

        </div>
    </div>

    <div class="card">
        <h2>Video URL</h2>

        <input
            type="url"
            id="videoUrl"
            placeholder="Paste video link here..."
        >

        <button class="download" onclick="startDownload()">
            ⬇️ Download Video
        </button>

        <div class="status" id="status"></div>
    </div>

</div>

<div class="footer">
    Premium Video Downloader
</div>

<script>
let selectedPlatform = "";

function selectPlatform(element, platform) {
    document.querySelectorAll(".platform").forEach(item => {
        item.classList.remove("selected");
    });

    element.classList.add("selected");
    selectedPlatform = platform;

    showStatus(platform + " selected.");
}

function showStatus(message) {
    const status = document.getElementById("status");
    status.style.display = "block";
    status.innerText = message;
}

function startDownload() {
    const url = document.getElementById("videoUrl").value.trim();

    if (!selectedPlatform) {
        showStatus("Please select a platform first.");
        return;
    }

    if (!url) {
        showStatus("Please paste a video URL.");
        return;
    }

    showStatus(
        "Your " + selectedPlatform +
        " link is ready. Download service will be connected next."
    );
}
</script>

</body>
</html>
